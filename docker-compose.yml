version: '3.8'

services:
  openspec-app:
    build: .
    ports:
      - "8080:3000"
    restart: unless-stopped
    environment:
      - PORT=3000
      - ROOM_CODE=VIBE
    networks:
      - openspec-net

  # Optional für den Live-Modus im lokalen Netzwerk ohne Internet
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - openspec-net
    profiles:
      - live-llm

volumes:
  ollama_data:

networks:
  openspec-net:
    driver: bridge
